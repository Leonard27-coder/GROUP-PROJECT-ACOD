# Gradle memory optimisation for a 4GB RAM computer
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Use fewer background workers
org.gradle.workers.max=1
org.gradle.parallel=false

# Temporarily disable configuration cache
org.gradle.configuration-cache=false

# Run Kotlin compilation inside the Gradle process
kotlin.compiler.execution.strategy=in-process

# Kotlin coding style
kotlin.code.style=official
